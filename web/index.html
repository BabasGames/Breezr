<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <title>Breezr</title>
  <link rel="icon" href="/assets/icon.png" type="image/png">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <span id="viewers" class="viewers" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewers-count"></span>
      </span>
      <span id="status" class="status" hidden></span>
      <div class="theme" id="theme">
        <button type="button" class="theme-button" id="theme-button" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.3-4-7.7-9-7.7z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7.5" r="1"/><circle cx="15" cy="7.5" r="1"/></svg>
        </button>
        <div class="menu-wrap"><div class="menu" id="theme-menu" role="menu"></div></div>
      </div>
    </header>
    <main class="stage" id="stage" hidden>
      <div class="cover-col"><img id="cover" class="cover" alt="" width="480" height="480"></div>
      <section class="lyrics" id="lyrics" aria-live="off"></section>
    </main>
    <p class="notice" id="notice"></p>
    <footer class="bar" id="bar" hidden>
      <div class="who">
        <img id="mini-cover" class="mini-cover" alt="" width="48" height="48">
        <div class="meta">
          <p id="title" class="title" dir="auto"><span></span></p>
          <p id="artists" class="artists" dir="auto"><span></span></p>
        </div>
      </div>
      <div class="center">
        <!-- Shows whether the music plays; not a control (viewers do not drive the player). -->
        <span class="play-state" id="play-state" role="img">
          <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </span>
        <div class="progress" id="progress">
          <span id="elapsed" class="time"></span>
          <div class="track"><div id="fill" class="fill"></div></div>
          <span id="total" class="time"></span>
        </div>
      </div>
      <div class="spacer" aria-hidden="true"></div>
    </footer>
    <p class="credits">
      <a id="made-with" href="https://github.com/BabasGames/Breezr" target="_blank" rel="noopener noreferrer"></a>
      <span aria-hidden="true">·</span>
      <a id="lyrics-by" href="https://lrclib.net" target="_blank" rel="noopener noreferrer"></a>
    </p>
  </div>
</body>
</html>
