name: Build

on:
  push:
    branches: [main]
    # A version tag (e.g. 2.1.0, no "v": the updater compares it with package.json) also drafts a release.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            build-os: linux
            artifacts: |
              dist/*.deb
              dist/*.AppImage
              dist/*.AppImage.zsync
              dist/*.rpm
              dist/*.snap
          - os: windows-latest
            build-os: windows
            artifacts: dist/*.exe
          - os: macos-latest
            build-os: macos
            artifacts: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run tsc
          bun run build:modal
          bun run copy-assets
          bun scripts/build.js ${{ matrix.build-os }}

      # AppImage update tools download this to fetch only the blocks that changed.
      - name: Generate AppImage zsync file
        if: matrix.build-os == 'linux'
        working-directory: dist
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          for appimage in *.AppImage; do
            zsyncmake -u "$appimage" -o "$appimage.zsync" "$appimage"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ matrix.artifacts }}
          name: ${{ runner.os }}-artifacts
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the tag matches package.json
        run: test "$(jq -r .version package.json)" = "$GITHUB_REF_NAME"

      - name: Download the installers of every OS
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release notes from the changelog
        run: |
          awk -v heading="## $GITHUB_REF_NAME" '$0 == heading { keep = 1; next } /^## / { keep = 0 } keep' CHANGELOG.md > notes.md
          test -s notes.md || echo "Breezr $GITHUB_REF_NAME" > notes.md

      # A draft: nothing is public until it is reviewed and published on GitHub.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --draft --title "Breezr $GITHUB_REF_NAME" --notes-file notes.md
